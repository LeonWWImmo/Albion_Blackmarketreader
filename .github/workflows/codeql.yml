name: CodeQL (SAST)

# Block 8: Statische Code-Analyse (Whitebox). Scannt den JS/TS-Code der Web-App
# und meldet Funde unter "Security -> Code scanning". Fuer oeffentliche Repos gratis.

on:
  push:
    branches: [ main, security ]
  pull_request:
    branches: [ main, security ]
  schedule:
    - cron: "0 5 * * 1"   # woechentlich, Montag 05:00 UTC

permissions:
  contents: read
  security-events: write   # noetig, um Ergebnisse an Code-Scanning zu melden

jobs:
  analyze:
    name: CodeQL Analyse (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL Analyse
        uses: github/codeql-action/analyze@v3

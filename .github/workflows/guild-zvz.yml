name: Guild ZvZ Reports

# Guild Pro (premium): every 30 minutes, the site posts the report of each new big fight of a marked
# guild to the Discord webhooks of its premium players who turned the ZvZ report on
# (/api/guild/zvz, see Albion_ProfitChecker/ui/api/_lib/guildApi.js). Vercel Cron starts it
# (vercel.json, api/cron/[job].js): GitHub's own schedule ran hours late.
# ACTIONS_CRON_SECRET is the same value as the Vercel env of that name.
# The job itself only calls the site; a run with nothing new does nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guild-zvz
  cancel-in-progress: false

jobs:
  zvz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post new ZvZ reports
        env:
          SECRET: ${{ secrets.ACTIONS_CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://blackmarketreader.com/api/guild/zvz
          echo
      # Guild Pro: keep the fights of the guilds premium players marked (attendance over 30 / 90 days)
      - name: Keep the Guild Pro fights
        if: always()
        env:
          SECRET: ${{ secrets.ACTIONS_CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://blackmarketreader.com/api/guild/pro-fights
          echo
      # the daily guild sync once more for guilds it missed (the Americas killboard is slow at 03:30 UTC)
      - name: Retry missed guild syncs
        if: always()
        env:
          SECRET: ${{ secrets.ACTIONS_CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://blackmarketreader.com/api/guild/sync-retry
          echo

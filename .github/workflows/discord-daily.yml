name: Discord Daily Update
# dry runs get their own title, so "already posted today" below only counts real posts
# (format() because the API may send the boolean input as a string)
run-name: ${{ format('{0}', inputs.dry_run) == 'true' && 'Discord Daily Update (dry run)' || 'Discord Daily Update' }}

# One run per day for both servers: today's crafting bonus, the gold price and the best Black
# Market crafts with the bonus, one message per region channel that pings the region role.
# The job starts after the 10:00 UTC reset and waits inside the script until AODP reports the
# new bonus (checks every 30 min, posts each region once, gives up at 16:00 UTC), so it never
# starts more than once a day. See Albion_ProfitChecker/ui/scripts/discord-daily.mjs.
#
# Vercel Cron starts it at 10:15 UTC by workflow_dispatch (api/cron/discord-daily.js), because
# GitHub's schedule trigger can run hours late. The schedule stays as a backup. Every real run
# does nothing when today's update was already posted (the channels are public, so no double
# pings), unless it is started by hand with "force".
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the messages, post nothing"
        type: boolean
        default: true
      region:
        description: "Only this server"
        type: choice
        options: [both, eu, us]
        default: both
      force:
        description: "Post even if today's update already went out"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: discord-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      posted: ${{ steps.today.outputs.posted }}
    steps:
      - name: Already posted today?
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          posted=false
          if [ "$DRY_RUN" != "true" ] && [ "$FORCE" != "true" ]; then
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow discord-daily.yml --status success --created ">=$(date -u +%F)" --json displayTitle -q '[.[] | select(.displayTitle == "Discord Daily Update")] | length')
            if [ "$runs" -gt 0 ]; then posted=true; fi
          fi
          echo "posted=$posted" >> "$GITHUB_OUTPUT"
          echo "already posted today: $posted"

  post:
    needs: check
    if: needs.check.outputs.posted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Albion_ProfitChecker/ui/package-lock.json

      - name: Install
        working-directory: Albion_ProfitChecker/ui
        run: npm ci --no-audit --no-fund

      - name: Post daily update
        working-directory: Albion_ProfitChecker/ui
        # the webhooks only reach this step, not npm ci and its install scripts
        env:
          DISCORD_WEBHOOK_EU: ${{ secrets.DISCORD_WEBHOOK_EU }}
          DISCORD_WEBHOOK_US: ${{ secrets.DISCORD_WEBHOOK_US }}
          DISCORD_ROLE_EU: ${{ vars.DISCORD_ROLE_EU }}
          DISCORD_ROLE_US: ${{ vars.DISCORD_ROLE_US }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
            if [ "$REGION" != "both" ]; then ARGS+=(--region "$REGION"); fi
          fi
          node scripts/discord-daily.mjs "${ARGS[@]}"

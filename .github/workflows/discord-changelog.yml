name: Discord Changelog

# Posts new CHANGELOG entries to a Discord updates channel whenever real code is
# pushed to main. The `paths` filter means data-refresh bot commits (which never
# touch CHANGELOG.md) do not trigger this workflow at all. Started by hand it posts the newest
# three bullets to the private tester channel, to try out the look.
on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff the push range

      - name: Extract newly added changelog entries
        id: notes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ADDED="$(grep -E '^- ' CHANGELOG.md | head -3)"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            { echo 'notes<<__EOF__'; echo "$ADDED"; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # First push / new branch: `before` is all zeroes and not a real commit.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse "${AFTER}~1" 2>/dev/null || echo '')"
          fi

          if [ -z "$BEFORE" ]; then
            # No parent to diff against: take every bullet currently in the file.
            ADDED="$(git show "${AFTER}:CHANGELOG.md" 2>/dev/null | grep -E '^- ' || true)"
          else
            # Only the bullet lines ADDED in this push (lines starting with "+- ").
            ADDED="$(git diff "${BEFORE}" "${AFTER}" -- CHANGELOG.md \
              | grep -E '^\+- ' | sed 's/^+//' || true)"
          fi

          if [ -z "$ADDED" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "No new changelog bullets in this push; nothing to announce."
            exit 0
          fi

          echo "has_notes=true" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<__EOF__'
            echo "$ADDED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: steps.notes.outputs.has_notes == 'true'
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
          EVENT: ${{ github.event_name }}
          PUBLIC_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TESTER_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TESTER }}
        run: |
          set -euo pipefail
          # a manual test run goes to the tester channel only, never to the public one
          if [ "$EVENT" = "workflow_dispatch" ]; then
            DISCORD_WEBHOOK_URL="$TESTER_WEBHOOK"
            if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_TESTER is not set"; exit 1; fi
          else
            DISCORD_WEBHOOK_URL="$PUBLIC_WEBHOOK"
            if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No Discord webhook configured; nothing posted."; exit 0; fi
          fi
          # one card (Discord components V2): banner, the new bullets, a button to the site
          PAYLOAD="$(jq -n --arg notes "$NOTES" '{
            username: "Blackmarket Reader",
            flags: 32768,
            allowed_mentions: { parse: [] },
            components: [ {
              type: 17,
              accent_color: 14263361,
              components: [
                { type: 12, items: [ { media: { url: "https://blackmarketreader.com/picture/hero-forge-1280.jpg" } } ] },
                { type: 10, content: ("-# 🚀 NEW ON BLACKMARKETREADER.COM\n## What is new\n" + $notes) },
                { type: 14, divider: true, spacing: 1 },
                { type: 1, components: [
                  { type: 2, style: 5, label: "Open the tools", emoji: { name: "🌐" }, url: "https://blackmarketreader.com" },
                  { type: 2, style: 5, label: "Full changelog", emoji: { name: "📜" }, url: "https://github.com/LeonWWImmo/Albion_Blackmarketreader/blob/main/CHANGELOG.md" }
                ] }
              ]
            } ]
          }')"
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL?with_components=true"

name: Live Market Snapshot

# Premium live market: every 30 minutes, the current AODP prices of every dashboard item in all
# eight markets (both regions) go to /api/market/ingest (stored in Supabase, not in git, so no
# commit and no deploy). The sales volume too once the stored one is 6 hours old. See
# Albion_ProfitChecker/ui/scripts/market-live.mjs. ACTIONS_CRON_SECRET = the Vercel env of that name.
# Vercel Cron starts it (vercel.json, api/cron.js): GitHub's own schedule ran hours late.
on:
  workflow_dispatch:
    inputs:
      volume:
        description: "Also fetch the sales volume"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: market-live
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # patterns, not cone mode: one file of public/ is enough
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Albion_ProfitChecker/Data/
            /Albion_ProfitChecker/ui/api/_lib/
            /Albion_ProfitChecker/ui/scripts/
            /Albion_ProfitChecker/ui/public/items-categorized-crafting.json
            /Albion_ProfitChecker/ui/public/data/raw-materials-cities-eu.json
            /Albion_ProfitChecker/ui/public/data/food-prices-eu.json
            /Albion_ProfitChecker/ui/public/data/potion-prices-eu.json
            /Albion_ProfitChecker/ui/public/data/consumable-ingredient-prices-eu.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send the snapshot
        working-directory: Albion_ProfitChecker/ui
        env:
          MARKET_SECRET: ${{ secrets.ACTIONS_CRON_SECRET }}
          MARKET_VOLUME: ${{ inputs.volume && '1' || '' }}
        run: node scripts/market-live.mjs
      # price alerts (premium): checked against fresh AODP prices, also when the snapshot failed
      - name: Check the price alerts
        if: always()
        env:
          SECRET: ${{ secrets.ACTIONS_CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://blackmarketreader.com/api/market/alerts-run
          echo
